# QUPIL_CI_MANAGED
name: Qupil on-demand builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Was soll gebaut werden?"
        required: true
        default: "all"
        type: choice
        options: [all, windows, macos, android, ios]
      source_ref:
        description: "Branch/Tag/Commit mit Qupil 1.5.x"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CI_QT_VERSION: "6.10.3"
  BUILD_TYPE: "Release"

jobs:
  windows:
    name: Windows x64
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build/windows --parallel
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem build/windows -Recurse -File -Filter "qupil.exe" |
            Where-Object { $_.FullName -notmatch "[\\/]CMakeFiles[\\/]" } |
            Select-Object -First 1
          if (-not $exe) { throw "qupil.exe wurde nicht gefunden." }
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist/Qupil-Windows-x64"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item $exe.FullName (Join-Path $dist "qupil.exe")
          windeployqt --release --qmldir "$env:GITHUB_WORKSPACE" --dir "$dist" (Join-Path $dist "qupil.exe")
          if (Test-Path "data") { Copy-Item "data" (Join-Path $dist "data") -Recurse -Force }
          Compress-Archive -Force -Path "$dist/*" -DestinationPath "dist/Qupil-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Qupil-Windows-x64
          path: dist/Qupil-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ARM64
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - name: Configure and build
        shell: bash
        run: |
          set -euxo pipefail
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/macos -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build/macos --parallel
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build/macos -type d -name '*.app' -print -quit || true)"
          if [[ -n "$APP" ]]; then
            macdeployqt "$APP" -qmldir="$GITHUB_WORKSPACE"
            cp -R "$APP" dist/Qupil.app
            (cd dist && ditto -c -k --sequesterRsrc --keepParent Qupil.app Qupil-macOS-arm64.zip)
          else
            BIN="$(find build/macos -type f -name qupil -perm -111 -print -quit || true)"
            [[ -n "$BIN" ]] || { echo "Keine Qupil-Binary gefunden" >&2; exit 1; }
            mkdir -p dist/Qupil-macOS-arm64
            cp "$BIN" dist/Qupil-macOS-arm64/
            [[ ! -d data ]] || cp -R data dist/Qupil-macOS-arm64/
            tar -C dist -czf dist/Qupil-macOS-arm64.tar.gz Qupil-macOS-arm64
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Qupil-macOS-arm64
          path: |
            dist/Qupil-macOS-arm64.zip
            dist/Qupil-macOS-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64 APK
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Android SDK/NDK fuer Qt 6.11
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true
      - name: Configure Android
        shell: bash
        run: |
          set -euxo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          HOST_ARG=()
          [[ -z "${QT_HOST_PATH:-}" ]] || HOST_ARG=(-DQT_HOST_PATH="$QT_HOST_PATH")
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK="$NDK" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            "${HOST_ARG[@]}"
      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/android --parallel
          cmake --build build/android --target apk --parallel
      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          mapfile -t APKS < <(find build/android -type f -name '*.apk' -print)
          ((${#APKS[@]} > 0)) || { echo "Kein APK gefunden." >&2; exit 1; }
          for apk in "${APKS[@]}"; do cp "$apk" "dist/$(basename "$apk")"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Qupil-Android-arm64
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS Simulator ARM64
    if: ${{ inputs.target == 'all' || inputs.target == 'ios' }}
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: mac
          target: ios
          arch: ios
          cache: true
      - name: Configure iOS Simulator
        shell: bash
        run: |
          set -euxo pipefail
          xcodebuild -version
          HOST_ARG=()
          [[ -z "${QT_HOST_PATH:-}" ]] || HOST_ARG=(-DQT_HOST_PATH="$QT_HOST_PATH")
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build/ios -G Xcode \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DQT_APPLE_SDK=iphonesimulator \
            -DQT_NO_SET_XCODE_DEVELOPMENT_TEAM_ID=ON \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            "${HOST_ARG[@]}"
      - name: Build iOS Simulator app
        shell: bash
        run: cmake --build build/ios --config Release --parallel
      - name: Package simulator app
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          APP="$(find build/ios -type d -name '*.app' -print -quit || true)"
          [[ -n "$APP" ]] || { echo "Kein .app-Bundle gefunden." >&2; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/Qupil-iOS-Simulator-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Qupil-iOS-Simulator-arm64
          path: dist/Qupil-iOS-Simulator-arm64.zip
          if-no-files-found: error
          retention-days: 14
