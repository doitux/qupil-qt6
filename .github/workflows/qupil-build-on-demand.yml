# QUPIL_CI_MANAGED
# QUPIL_NATIVE_ARTIFACTS_V1
#
# Qupil Cross-Platform CI
# Linux wird absichtlich lokal mit Qt Creator gebaut.
#
# Die Jobs sind nur manuell startbar.

name: Qupil on-demand builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Was soll gebaut werden?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - android
          - ios

      source_ref:
        description: "Branch, Tag oder Commit mit dem zu bauenden Qupil-Stand"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CI_QT_VERSION: "6.10.3"
  IOS_QT_VERSION: "6.11.2"
  IOS_DEPLOYMENT_TARGET: "17.0"
  BUILD_TYPE: "Release"

jobs:

  # ---------------------------------------------------------------------------
  # WINDOWS
  #
  # Wichtig:
  # Qt-Paket ist MSVC 2022. Deshalb benutzen wir auch wirklich cl.exe/MSVC.
  # Der Runner windows-2022 enthaelt VS 2022; VsDevCmd.bat setzt die Umgebung nativ.
  # Ninja vermeidet Generator-/Visual-Studio-Discovery-Probleme.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia"
          cache: true

      - name: Enable MSVC 2022 x64 environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $vsInstall = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found."
          }

          $vsInstall = $vsInstall.Trim()
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat not found: $vsDevCmd"
          }

          Write-Host "Visual Studio: $vsInstall"
          Write-Host "VsDevCmd:      $vsDevCmd"

          $command = "call `"$vsDevCmd`" -no_logo -arch=amd64 -host_arch=amd64 && set"
          $devEnvironment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
          }

          foreach ($line in $devEnvironment) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) {
              continue
            }

            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)

            if ($name -ieq 'PATH') {
              foreach ($entry in $value.Split(';')) {
                if (-not [string]::IsNullOrWhiteSpace($entry)) {
                  Add-Content -Path $env:GITHUB_PATH -Value $entry
                }
              }
              continue
            }

            if ($name.StartsWith('GITHUB_', [System.StringComparison]::OrdinalIgnoreCase) -or
                $name.StartsWith('RUNNER_', [System.StringComparison]::OrdinalIgnoreCase) -or
                $name -ieq 'CI') {
              continue
            }

            Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
          }

      - name: Toolchain preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Qt root: $env:QT_ROOT_DIR"
          Write-Host "PATH: $env:PATH"

          where.exe cl
          where.exe cmake
          where.exe ninja
          where.exe windeployqt

          cl 2>&1 | Select-Object -First 5
          cmake --version
          ninja --version
          qmake --version

          $required = @(
            "$env:QT_ROOT_DIR\lib\cmake\Qt6\Qt6Config.cmake",
            "$env:QT_ROOT_DIR\lib\cmake\Qt6Multimedia\Qt6MultimediaConfig.cmake",
            "$env:QT_ROOT_DIR\lib\cmake\Qt6Svg\Qt6SvgConfig.cmake"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Erforderliche Qt-Datei fehlt: $file"
            }
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build/windows --parallel

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $versionMatch = Select-String -Path "CMakeLists.txt" -Pattern 'project\(Qupil\s+VERSION\s+([0-9.]+)'
          if (-not $versionMatch) {
            throw "Qupil version not found in CMakeLists.txt"
          }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $commit = (git rev-parse --short=7 HEAD).Trim()
          $baseName = "Qupil-$version-$commit-Windows-x64-Setup"

          $exe = Get-ChildItem build/windows -Recurse -File -Filter "qupil.exe" |
            Where-Object { $_.FullName -notmatch "[\\/]CMakeFiles[\\/]" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Build files:"
            Get-ChildItem build/windows -Recurse -File |
              Select-Object -First 200 FullName
            throw "qupil.exe was not found."
          }

          $distRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $dist = Join-Path $distRoot "Qupil-Windows-x64"
          if (Test-Path $distRoot) {
            Remove-Item $distRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $destExe = Join-Path $dist "qupil.exe"
          Copy-Item $exe.FullName $destExe -Force

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --dir "$dist" `
            "$destExe"
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          if (Test-Path "data") {
            Copy-Item "data" (Join-Path $dist "data") -Recurse -Force
          }

          $isccCommand = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($isccCommand) {
            $iscc = $isccCommand.Source
          } else {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup ISCC.exe was not found on the windows-2022 runner."
          }

          $env:QUPIL_INSTALLER_VERSION = $version
          $env:QUPIL_INSTALLER_SOURCE_DIR = $dist
          $env:QUPIL_INSTALLER_OUTPUT_DIR = $distRoot
          $env:QUPIL_INSTALLER_BASE_NAME = $baseName

          Write-Host "Inno Setup: $iscc"
          Write-Host "Installer:  $baseName.exe"
          & $iscc ".github\packaging\windows\Qupil.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = Join-Path $distRoot "$baseName.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not created: $installer"
          }
          if ((Get-Item $installer).Length -le 0) {
            throw "Installer is empty: $installer"
          }

          Get-Item $installer | Format-List FullName, Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/Qupil-*-Windows-x64-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS ARM64
  # macos-15 ist bei Standard-GitHub-Runnern ARM64.
  # Wir setzen explizit Apple clang, damit kein Homebrew-clang dazwischenkommt.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS ARM64
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: mac
          target: desktop
          modules: "qtmultimedia"
          cache: true

      - name: Toolchain preflight
        shell: bash
        run: |
          set -euxo pipefail

          uname -a
          uname -m

          /usr/bin/clang++ --version
          cmake --version
          ninja --version
          "$QT_ROOT_DIR/bin/qmake" --version

          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"

      - name: Configure
        shell: bash
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -euxo pipefail

          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/macos \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/macos --parallel

      - name: Build macOS DMG
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$VERSION" ]]
          COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"
          DMG="dist/Qupil-${VERSION}-${COMMIT_SHORT}-macOS-arm64.dmg"

          rm -rf dist
          mkdir -p dist/dmg-root

          APP="$(find build/macos -type d -name '*.app' -print -quit || true)"
          if [[ -z "$APP" ]]; then
              find build/macos -maxdepth 5 -type f -print | head -200
              echo "No .app bundle was found; cannot create a macOS DMG." >&2
              exit 1
          fi

          echo "Found app: $APP"
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP"

          cp -R "$APP" dist/dmg-root/Qupil.app
          if [[ -d data ]]; then
              cp -R data dist/dmg-root/data
          fi
          ln -s /Applications dist/dmg-root/Applications

          hdiutil create \
            -volname "Qupil ${VERSION}" \
            -srcfolder dist/dmg-root \
            -ov \
            -format UDZO \
            "$DMG"

          test -s "$DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          path: dist/Qupil-*-macOS-arm64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # ANDROID ARM64
  # Qt 6.10:
  #   JDK 17
  #   Android API 36
  #   Build Tools 36.0.0
  #   NDK 27.2.12479018
  # ---------------------------------------------------------------------------
  android:
    name: Android ARM64 APK
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK for Qt 6.10
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Install Qt for Android ARM64
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: "qtmultimedia"
          cache: true

      - name: Android preflight
        shell: bash
        run: |
          set -euxo pipefail

          java -version
          cmake --version
          ninja --version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=${QT_HOST_PATH:-}"

          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"

      - name: Configure Android
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euxo pipefail

          EXTRA_ARGS=()

          if [[ -n "${QT_HOST_PATH:-}" ]]; then
              EXTRA_ARGS+=("-DQT_HOST_PATH=$QT_HOST_PATH")
          fi

          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            "${EXTRA_ARGS[@]}"

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build/android --target apk --parallel

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$VERSION" ]]
          COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"

          rm -rf dist
          mkdir -p dist

          mapfile -t APKS < <(find build/android -type f -name '*.apk' -print)
          if ((${#APKS[@]} == 0)); then
              echo "No APK was found." >&2
              find build/android -maxdepth 7 -type f -print | head -300
              exit 1
          fi

          printf 'APK candidates:\n'
          printf '  %s\n' "${APKS[@]}"

          APK="$(find build/android -type f -name '*.apk' -printf '%s\t%p\n' | sort -nr | head -n1 | cut -f2-)"
          [[ -n "$APK" ]]

          DEST="dist/Qupil-${VERSION}-${COMMIT_SHORT}-Android-arm64.apk"
          cp "$APK" "$DEST"
          test -s "$DEST"
          ls -lh "$DEST"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/Qupil-*-Android-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # iOS SIMULATOR ARM64
  #
  # Absichtlich ohne Signing. Das Ergebnis dient fuer CI/Simulator-Tests.
  # Eine echte iPhone/TestFlight-Version braucht spaeter Signing-Secrets.
  # ---------------------------------------------------------------------------
  # iOS / iPadOS DEVICE BUILD
  #
  # Diese Logik stammt aus dem bisherigen build-qupil-ios-from-dev.sh.
  # Es wird direkt der durch source_ref ausgewaehlte Commit gebaut.
  # Kein Mirror-Repo, kein zweiter Dispatch, kein lokales Snapshot-Repo.
  # Ergebnis: unsigned IPA fuer den bestehenden SideStore-Workflow.
  # ---------------------------------------------------------------------------
  # iOS / iPadOS DEVICE BUILD
  #
  # Diese Logik stammt aus dem bisherigen build-qupil-ios-from-dev.sh.
  # Es wird direkt der durch source_ref ausgewaehlte Commit gebaut.
  # Kein Mirror-Repo, kein zweiter Dispatch, kein lokales Snapshot-Repo.
  # Ergebnis: unsigned IPA fuer den bestehenden SideStore-Workflow.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS/iPadOS unsigned IPA
    if: ${{ inputs.target == 'all' || inputs.target == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 75

    env:
      QT_VERSION: "6.11.2"
      IOS_DEPLOYMENT_TARGET: "17.0"

    steps:
      - name: Checkout committed Qupil source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve source metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"
          PROGRAM_VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$PROGRAM_VERSION" ]] || PROGRAM_VERSION="unknown"
          {
            echo "QUPIL_SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "QUPIL_SOURCE_COMMIT_SHORT=$SOURCE_COMMIT_SHORT"
            echo "QUPIL_SOURCE_VERSION=$PROGRAM_VERSION"
          } >> "$GITHUB_ENV"
          echo "Qupil version: $PROGRAM_VERSION"
          echo "Source commit: $SOURCE_COMMIT"

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          ninja --version || true
          gh --version

      - name: Install Qt host and iOS
        shell: bash
        run: |
          set -euxo pipefail
          AQT_VENV="$RUNNER_TEMP/aqt-venv"
          QT_ROOT="$RUNNER_TEMP/Qt"
          python3 -m venv "$AQT_VENV"
          "$AQT_VENV/bin/python" -m pip install --upgrade pip
          "$AQT_VENV/bin/python" -m pip install 'aqtinstall==3.3.0'

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --arch "$QT_VERSION" | tee "$RUNNER_TEMP/qt-ios-arches.txt"
          grep -Eq '(^|[[:space:]])ios([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-arches.txt"

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --modules "$QT_VERSION" ios | tee "$RUNNER_TEMP/qt-ios-modules.txt"
          grep -Eq '(^|[[:space:]])qtmultimedia([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-modules.txt"

          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac desktop "$QT_VERSION" clang_64 --modules qtmultimedia
          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac ios "$QT_VERSION" ios --modules qtmultimedia

          test -x "$QT_ROOT/$QT_VERSION/macos/bin/qt-cmake"
          test -x "$QT_ROOT/$QT_VERSION/ios/bin/qt-cmake"

      - name: Re-run source validation on macOS
        shell: bash
        run: |
          set -euxo pipefail
          for test in source_sanity.py sql_static_smoke.py i18n_static_smoke.py i18n_catalog_smoke.py; do
            if [[ -f "tests/$test" ]]; then
              python3 "tests/$test"
            fi
          done

      - name: Compile translation catalog
        shell: bash
        run: |
          set -euxo pipefail
          QT_HOST="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          if [[ -f i18n/qupil_de.ts ]]; then
            "$QT_HOST/bin/lrelease" i18n/qupil_de.ts -qm i18n/qupil_de.qm
            test -s i18n/qupil_de.qm
          fi

      - name: Verify iOS FFmpeg integration
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'qt_add_ios_ffmpeg_libraries(qupil)' CMakeLists.txt
          grep -Fq 'QT_NO_FFMPEG_XCODE_EMBED_FRAMEWORKS_CODE_SIGN_ON_COPY' CMakeLists.txt

      - name: Configure iPhone/iPad Release
        shell: bash
        run: |
          set -euxo pipefail
          QT_ROOT="$RUNNER_TEMP/Qt"
          QT_HOST="$QT_ROOT/$QT_VERSION/macos"
          QT_IOS="$QT_ROOT/$QT_VERSION/ios"
          rm -rf build-ios
          "$QT_IOS/bin/qt-cmake" \
            -S . -B build-ios -G Xcode \
            -DQT_HOST_PATH="$QT_HOST" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-ios --config Release --parallel 4 -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build-ios -type d -name '*.app' -path '*iphoneos*' -print | head -n 1)"
          test -n "$APP"
          test -d "$APP"
          echo "Device app: $APP"

          IPA_FILENAME="Qupil-${QUPIL_SOURCE_VERSION}-${QUPIL_SOURCE_COMMIT_SHORT}-iOS-arm64.ipa"
          echo "QUPIL_IOS_IPA_FILENAME=$IPA_FILENAME" >> "$GITHUB_ENV"

          rm -rf dist Payload
          mkdir -p dist Payload
          /usr/bin/ditto "$APP" Payload/Qupil.app
          /usr/bin/zip -qry "dist/$IPA_FILENAME" Payload
          rm -rf Payload

          test -s "dist/$IPA_FILENAME"
          /usr/bin/unzip -Z1 "dist/$IPA_FILENAME" | grep -q '^Payload/Qupil.app/'
          shasum -a 256 "dist/$IPA_FILENAME"
          ls -lh "dist/$IPA_FILENAME"

      - name: Upload iOS IPA
        id: upload_ios
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.QUPIL_IOS_IPA_FILENAME }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add iOS artifact link to summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_ios.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo '## Qupil iOS'
            echo
            echo "Artifact: $QUPIL_IOS_IPA_FILENAME"
            echo "Commit: $QUPIL_SOURCE_COMMIT"
            echo
            echo "[IPA artifact herunterladen]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
