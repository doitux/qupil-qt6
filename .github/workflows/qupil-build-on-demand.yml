# QUPIL_CI_MANAGED
# QUPIL_NATIVE_ARTIFACTS_V1
# QUPIL_TESTFLIGHT_V1
#
# Qupil Cross-Platform CI
# Linux wird absichtlich lokal mit Qt Creator gebaut.
#
# Die Jobs sind nur manuell startbar.

name: Qupil on-demand builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Was soll gebaut werden?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - android
          - ios
          - ios-testflight

      source_ref:
        description: "Branch, Tag oder Commit mit dem zu bauenden Qupil-Stand"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CI_QT_VERSION: "6.10.3"
  IOS_QT_VERSION: "6.11.2"
  IOS_DEPLOYMENT_TARGET: "17.0"
  BUILD_TYPE: "Release"

jobs:

  # ---------------------------------------------------------------------------
  # WINDOWS
  #
  # Wichtig:
  # Qt-Paket ist MSVC 2022. Deshalb benutzen wir auch wirklich cl.exe/MSVC.
  # Der Runner windows-2022 enthaelt VS 2022; VsDevCmd.bat setzt die Umgebung nativ.
  # Ninja vermeidet Generator-/Visual-Studio-Discovery-Probleme.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia"
          cache: true

      - name: Enable MSVC 2022 x64 environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found: $vswhere"
          }

          $vsInstall = & $vswhere `
            -latest `
            -products '*' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($vsInstall)) {
            throw "Visual Studio with the x64 C++ toolchain was not found."
          }

          $vsInstall = $vsInstall.Trim()
          $vsDevCmd = Join-Path $vsInstall "Common7\Tools\VsDevCmd.bat"
          if (-not (Test-Path $vsDevCmd)) {
            throw "VsDevCmd.bat not found: $vsDevCmd"
          }

          Write-Host "Visual Studio: $vsInstall"
          Write-Host "VsDevCmd:      $vsDevCmd"

          $command = "call `"$vsDevCmd`" -no_logo -arch=amd64 -host_arch=amd64 && set"
          $devEnvironment = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "VsDevCmd.bat failed with exit code $LASTEXITCODE"
          }

          foreach ($line in $devEnvironment) {
            $separator = $line.IndexOf('=')
            if ($separator -le 0) {
              continue
            }

            $name = $line.Substring(0, $separator)
            $value = $line.Substring($separator + 1)

            if ($name -ieq 'PATH') {
              foreach ($entry in $value.Split(';')) {
                if (-not [string]::IsNullOrWhiteSpace($entry)) {
                  Add-Content -Path $env:GITHUB_PATH -Value $entry
                }
              }
              continue
            }

            if ($name.StartsWith('GITHUB_', [System.StringComparison]::OrdinalIgnoreCase) -or
                $name.StartsWith('RUNNER_', [System.StringComparison]::OrdinalIgnoreCase) -or
                $name -ieq 'CI') {
              continue
            }

            Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
          }

      - name: Toolchain preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Qt root: $env:QT_ROOT_DIR"
          Write-Host "PATH: $env:PATH"

          where.exe cl
          where.exe cmake
          where.exe ninja
          where.exe windeployqt

          cl 2>&1 | Select-Object -First 5
          cmake --version
          ninja --version
          qmake --version

          $required = @(
            "$env:QT_ROOT_DIR\lib\cmake\Qt6\Qt6Config.cmake",
            "$env:QT_ROOT_DIR\lib\cmake\Qt6Multimedia\Qt6MultimediaConfig.cmake",
            "$env:QT_ROOT_DIR\lib\cmake\Qt6Svg\Qt6SvgConfig.cmake"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Erforderliche Qt-Datei fehlt: $file"
            }
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build/windows --parallel

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $versionMatch = Select-String -Path "CMakeLists.txt" -Pattern 'project\(Qupil\s+VERSION\s+([0-9.]+)'
          if (-not $versionMatch) {
            throw "Qupil version not found in CMakeLists.txt"
          }
          $version = $versionMatch.Matches[0].Groups[1].Value
          $commit = (git rev-parse --short=7 HEAD).Trim()
          $baseName = "Qupil-$version-$commit-Windows-x64-Setup"

          $exe = Get-ChildItem build/windows -Recurse -File -Filter "qupil.exe" |
            Where-Object { $_.FullName -notmatch "[\\/]CMakeFiles[\\/]" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Build files:"
            Get-ChildItem build/windows -Recurse -File |
              Select-Object -First 200 FullName
            throw "qupil.exe was not found."
          }

          $distRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $dist = Join-Path $distRoot "Qupil-Windows-x64"
          if (Test-Path $distRoot) {
            Remove-Item $distRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $destExe = Join-Path $dist "qupil.exe"
          Copy-Item $exe.FullName $destExe -Force

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --dir "$dist" `
            "$destExe"
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          # QUPIL_PACKAGE_DIET_V1_WINDOWS_SQLITE_ONLY
          # Qupil supports SQLite only; remove SQL drivers copied by
          # windeployqt that the application can never use.
          $sqlDriverDir = Join-Path $dist "sqldrivers"
          $qsqlite = Join-Path $sqlDriverDir "qsqlite.dll"
          if (-not (Test-Path $qsqlite)) {
            throw "Required SQLite driver was not deployed: $qsqlite"
          }

          Get-ChildItem $sqlDriverDir -File -Filter "qsql*.dll" |
            Where-Object { $_.Name -ne "qsqlite.dll" } |
            Remove-Item -Force

          $unexpectedSqlDrivers = Get-ChildItem $sqlDriverDir -File -Filter "qsql*.dll" |
            Where-Object { $_.Name -ne "qsqlite.dll" }
          if ($unexpectedSqlDrivers) {
            throw "Unexpected SQL drivers remain in the Windows package: $($unexpectedSqlDrivers.Name -join ', ')"
          }


          $isccCommand = Get-Command "ISCC.exe" -ErrorAction SilentlyContinue
          if ($isccCommand) {
            $iscc = $isccCommand.Source
          } else {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            throw "Inno Setup ISCC.exe was not found on the windows-2022 runner."
          }

          $env:QUPIL_INSTALLER_VERSION = $version
          $env:QUPIL_INSTALLER_SOURCE_DIR = $dist
          $env:QUPIL_INSTALLER_OUTPUT_DIR = $distRoot
          $env:QUPIL_INSTALLER_BASE_NAME = $baseName

          Write-Host "Inno Setup: $iscc"
          Write-Host "Installer:  $baseName.exe"
          & $iscc ".github\packaging\windows\Qupil.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $installer = Join-Path $distRoot "$baseName.exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not created: $installer"
          }
          if ((Get-Item $installer).Length -le 0) {
            throw "Installer is empty: $installer"
          }

          Get-Item $installer | Format-List FullName, Length

      - name: Audit Windows package size
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dist = Join-Path $env:GITHUB_WORKSPACE "dist\Qupil-Windows-x64"
          $installer = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE "dist") -File -Filter "Qupil-*-Windows-x64-Setup.exe" |
            Select-Object -First 1
          if (-not (Test-Path $dist)) { throw "Windows staging directory missing: $dist" }
          if (-not $installer) { throw "Windows installer missing for package audit" }

          $files = @(Get-ChildItem $dist -Recurse -File)
          $totalBytes = ($files | Measure-Object Length -Sum).Sum
          if ($null -eq $totalBytes) { $totalBytes = 0 }
          $qtDlls = @($files | Where-Object { $_.Name -like 'Qt6*.dll' })
          $ffmpeg = @($files | Where-Object { $_.Name -match '(?i)(avcodec|avformat|avutil|swresample|swscale|ffmpeg)' })
          $sqlDrivers = @($files | Where-Object { $_.FullName -match '[\\/]sqldrivers[\\/]' })

          Write-Host "Windows staged package: $([math]::Round($totalBytes / 1MB, 2)) MiB"
          Write-Host "Installer: $([math]::Round($installer.Length / 1MB, 2)) MiB"
          Write-Host "Qt DLL count: $($qtDlls.Count)"
          Write-Host "SQL drivers: $($sqlDrivers.Name -join ', ')"
          Write-Host "FFmpeg-related files: $($ffmpeg.Count)"
          Write-Host "Top 20 staged files:"
          $files | Sort-Object Length -Descending | Select-Object -First 20 |
            ForEach-Object { '{0,10:N2} MiB  {1}' -f ($_.Length / 1MB), $_.FullName.Substring($dist.Length + 1) }

          dumpbin /dependents (Join-Path $dist "qupil.exe") | Select-Object -First 200

          @(
            "### Windows package audit"
            ""
            "- Staged runtime: $([math]::Round($totalBytes / 1MB, 2)) MiB"
            "- Installer: $([math]::Round($installer.Length / 1MB, 2)) MiB"
            "- Qt DLLs: $($qtDlls.Count)"
            "- SQL drivers: $($sqlDrivers.Name -join ', ')"
            "- FFmpeg-related files: $($ffmpeg.Count)"
            "- Legacy external data directory copied: no"
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/Qupil-*-Windows-x64-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # macOS ARM64
  # macos-15 ist bei Standard-GitHub-Runnern ARM64.
  # Wir setzen explizit Apple clang, damit kein Homebrew-clang dazwischenkommt.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS ARM64
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: mac
          target: desktop
          modules: "qtmultimedia"
          cache: true

      - name: Toolchain preflight
        shell: bash
        run: |
          set -euxo pipefail

          uname -a
          uname -m

          /usr/bin/clang++ --version
          cmake --version
          ninja --version
          "$QT_ROOT_DIR/bin/qmake" --version

          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"

      - name: Configure
        shell: bash
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -euxo pipefail

          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/macos \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/macos --parallel

      - name: Build macOS DMG
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$VERSION" ]]
          COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"
          DMG="dist/Qupil-${VERSION}-${COMMIT_SHORT}-macOS-arm64.dmg"

          rm -rf dist
          mkdir -p dist/dmg-root

          APP="$(find build/macos -type d -name '*.app' -print -quit || true)"
          if [[ -z "$APP" ]]; then
              find build/macos -maxdepth 5 -type f -print | head -200
              echo "No .app bundle was found; cannot create a macOS DMG." >&2
              exit 1
          fi

          echo "Found app: $APP"

          # QUPIL_PACKAGE_DIET_V1_MAC_SQLITE_ONLY
          # Qupil supports SQLite only. macdeployqt scans all SQL drivers in
          # the Qt installation, so prune the ephemeral CI Qt tree first.
          SQL_DRIVER_DIR="$QT_ROOT_DIR/plugins/sqldrivers"
          test -d "$SQL_DRIVER_DIR"
          test -f "$SQL_DRIVER_DIR/libqsqlite.dylib"

          echo "Qt SQL drivers before pruning:"
          find "$SQL_DRIVER_DIR" -maxdepth 1 -type f -name 'libqsql*.dylib' -print | sort
          find "$SQL_DRIVER_DIR" -maxdepth 1 -type f \
            -name 'libqsql*.dylib' ! -name 'libqsqlite.dylib' -delete

          test "$(find "$SQL_DRIVER_DIR" -maxdepth 1 -type f -name 'libqsql*.dylib' | wc -l | tr -d ' ')" -eq 1
          "$QT_ROOT_DIR/bin/macdeployqt" "$APP" -verbose=2

          test -f "$APP/Contents/PlugIns/sqldrivers/libqsqlite.dylib"
          test ! -e "$APP/Contents/PlugIns/sqldrivers/libqsqlpsql.dylib"

          ditto "$APP" dist/dmg-root/Qupil.app
          ln -s /Applications dist/dmg-root/Applications

          VOLNAME="Qupil ${VERSION} ${COMMIT_SHORT}"
          TMP_DMG="$RUNNER_TEMP/$(basename "$DMG")"
          rm -f "$TMP_DMG" "$DMG"
          hdiutil detach -force "/Volumes/$VOLNAME" >/dev/null 2>&1 || true

          DMG_CREATED=0
          for attempt in 1 2 3; do
              if hdiutil create \
                -volname "$VOLNAME" \
                -srcfolder dist/dmg-root \
                -ov \
                -format UDZO \
                "$TMP_DMG"; then
                  DMG_CREATED=1
                  break
              fi

              echo "hdiutil create attempt $attempt failed; cleaning up before retry" >&2
              hdiutil info || true
              hdiutil detach -force "/Volumes/$VOLNAME" >/dev/null 2>&1 || true
              rm -f "$TMP_DMG"
              sleep $((attempt * 2))
          done

          test "$DMG_CREATED" -eq 1
          test -s "$TMP_DMG"
          mv "$TMP_DMG" "$DMG"

          test -s "$DMG"
          hdiutil verify "$DMG"
          ls -lh "$DMG"

      - name: Audit macOS package size
        shell: bash
        run: |
          set -euo pipefail

          APP="dist/dmg-root/Qupil.app"
          DMG="$(find dist -maxdepth 1 -type f -name 'Qupil-*-macOS-arm64.dmg' -print -quit)"
          test -d "$APP"
          test -s "$DMG"

          echo "macOS app bundle: $(du -sh "$APP" | awk '{print $1}')"
          echo "macOS DMG:        $(du -sh "$DMG" | awk '{print $1}')"
          echo "Top 20 app-bundle files:"
          find "$APP" -type f -exec stat -f '%z %N' {} + | sort -nr | head -20
          echo "Bundled frameworks:"
          find "$APP/Contents/Frameworks" -maxdepth 1 -type d -name '*.framework' -print 2>/dev/null | sort || true
          echo "Bundled plugins:"
          find "$APP/Contents/PlugIns" -type f -print 2>/dev/null | sort || true
          echo "FFmpeg-related files:"
          find "$APP" -type f -print | grep -Ei '/(avcodec|avformat|avutil|swresample|swscale|ffmpeg)' || true

          {
            echo '### macOS package audit'
            echo
            echo "- App bundle: $(du -sh "$APP" | awk '{print $1}')"
            echo "- DMG: $(du -sh "$DMG" | awk '{print $1}')"
            echo "- SQL drivers: $(find "$APP/Contents/PlugIns/sqldrivers" -maxdepth 1 -type f -name 'libqsql*.dylib' -exec basename {} \; 2>/dev/null | paste -sd ', ' -)"
            echo "- FFmpeg-related files: $(find "$APP" -type f -print | grep -Eic '/(avcodec|avformat|avutil|swresample|swscale|ffmpeg)' || true)"
            echo '- Legacy external data directory copied: no'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v7
        with:
          path: dist/Qupil-*-macOS-arm64.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # ANDROID ARM64
  # Qt 6.10:
  #   JDK 17
  #   Android API 36
  #   Build Tools 36.0.0
  #   NDK 27.2.12479018
  # ---------------------------------------------------------------------------
  android:
    name: Android ARM64 APK
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK for Qt 6.10
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Install Qt for Android ARM64
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: "qtmultimedia"
          cache: true

      - name: Android preflight
        shell: bash
        run: |
          set -euxo pipefail

          java -version
          cmake --version
          ninja --version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=${QT_HOST_PATH:-}"

          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"

      - name: Configure Android
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euxo pipefail

          EXTRA_ARGS=()

          if [[ -n "${QT_HOST_PATH:-}" ]]; then
              EXTRA_ARGS+=("-DQT_HOST_PATH=$QT_HOST_PATH")
          fi

          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            "${EXTRA_ARGS[@]}"

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build/android --target apk --parallel

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$VERSION" ]]
          COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"

          rm -rf dist
          mkdir -p dist

          mapfile -t APKS < <(find build/android -type f -name '*.apk' -print)
          if ((${#APKS[@]} == 0)); then
              echo "No APK was found." >&2
              find build/android -maxdepth 7 -type f -print | head -300
              exit 1
          fi

          printf 'APK candidates:\n'
          printf '  %s\n' "${APKS[@]}"

          APK="$(find build/android -type f -name '*.apk' -printf '%s\t%p\n' | sort -nr | head -n1 | cut -f2-)"
          [[ -n "$APK" ]]

          DEST="dist/Qupil-${VERSION}-${COMMIT_SHORT}-Android-arm64.apk"
          cp "$APK" "$DEST"
          test -s "$DEST"
          ls -lh "$DEST"

      - name: Audit Android package size
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find dist -maxdepth 1 -type f -name 'Qupil-*-Android-arm64.apk' -print -quit)"
          test -s "$APK"
          echo "APK: $(du -sh "$APK" | awk '{print $1}')"
          echo "Top 20 APK members by uncompressed size:"
          unzip -l "$APK" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ { print $1 "\t" $4 }' | sort -nr | head -20
          echo "Native libraries:"
          unzip -Z1 "$APK" | grep '^lib/' | sort || true
          echo "FFmpeg-related APK members:"
          unzip -Z1 "$APK" | grep -Ei '(avcodec|avformat|avutil|swresample|swscale|ffmpeg)' || true

          UNCOMPRESSED_BYTES="$(unzip -l "$APK" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ { total += $1 } END { print total + 0 }')"
          FFMPEG_COUNT="$(unzip -Z1 "$APK" | grep -Eic '(avcodec|avformat|avutil|swresample|swscale|ffmpeg)' || true)"
          FFMPEG_BYTES="$(unzip -l "$APK" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ && tolower($4) ~ /(avcodec|avformat|avutil|swresample|swscale|ffmpeg)/ { total += $1 } END { print total + 0 }')"
          {
            echo '### Android package audit'
            echo
            echo "- APK: $(du -sh "$APK" | awk '{print $1}')"
            echo "- Uncompressed members: $((UNCOMPRESSED_BYTES / 1024 / 1024)) MiB"
            echo "- FFmpeg-related members: $FFMPEG_COUNT ($((FFMPEG_BYTES / 1024 / 1024)) MiB uncompressed)"
            echo '- Qt FFmpeg media plugin excluded: yes'
            echo '- Build type is still Debug; Release/signing is a separate Package Diet step.'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$FFMPEG_COUNT" != "0" ]]; then
              echo "Package Diet v2 expected zero FFmpeg members in the Android APK, found $FFMPEG_COUNT." >&2
              exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          path: dist/Qupil-*-Android-arm64.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # iOS SIMULATOR ARM64
  #
  # Absichtlich ohne Signing. Das Ergebnis dient fuer CI/Simulator-Tests.
  # Eine echte iPhone/TestFlight-Version braucht spaeter Signing-Secrets.
  # ---------------------------------------------------------------------------
  # iOS / iPadOS DEVICE BUILD
  #
  # Diese Logik stammt aus dem bisherigen build-qupil-ios-from-dev.sh.
  # Es wird direkt der durch source_ref ausgewaehlte Commit gebaut.
  # Kein Mirror-Repo, kein zweiter Dispatch, kein lokales Snapshot-Repo.
  # Ergebnis: unsigned IPA fuer den bestehenden SideStore-Workflow.
  # ---------------------------------------------------------------------------
  # iOS / iPadOS DEVICE BUILD
  #
  # Diese Logik stammt aus dem bisherigen build-qupil-ios-from-dev.sh.
  # Es wird direkt der durch source_ref ausgewaehlte Commit gebaut.
  # Kein Mirror-Repo, kein zweiter Dispatch, kein lokales Snapshot-Repo.
  # Ergebnis: unsigned IPA fuer den bestehenden SideStore-Workflow.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS/iPadOS unsigned IPA
    if: ${{ inputs.target == 'all' || inputs.target == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 75

    env:
      QT_VERSION: "6.11.2"
      IOS_DEPLOYMENT_TARGET: "17.0"

    steps:
      - name: Checkout committed Qupil source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve source metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"
          PROGRAM_VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$PROGRAM_VERSION" ]] || PROGRAM_VERSION="unknown"
          {
            echo "QUPIL_SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "QUPIL_SOURCE_COMMIT_SHORT=$SOURCE_COMMIT_SHORT"
            echo "QUPIL_SOURCE_VERSION=$PROGRAM_VERSION"
          } >> "$GITHUB_ENV"
          echo "Qupil version: $PROGRAM_VERSION"
          echo "Source commit: $SOURCE_COMMIT"

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          ninja --version || true
          gh --version

      - name: Install Qt host and iOS
        shell: bash
        run: |
          set -euxo pipefail
          AQT_VENV="$RUNNER_TEMP/aqt-venv"
          QT_ROOT="$RUNNER_TEMP/Qt"
          python3 -m venv "$AQT_VENV"
          "$AQT_VENV/bin/python" -m pip install --upgrade pip
          "$AQT_VENV/bin/python" -m pip install 'aqtinstall==3.3.0'

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --arch "$QT_VERSION" | tee "$RUNNER_TEMP/qt-ios-arches.txt"
          grep -Eq '(^|[[:space:]])ios([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-arches.txt"

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --modules "$QT_VERSION" ios | tee "$RUNNER_TEMP/qt-ios-modules.txt"
          grep -Eq '(^|[[:space:]])qtmultimedia([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-modules.txt"

          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac desktop "$QT_VERSION" clang_64 --modules qtmultimedia
          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac ios "$QT_VERSION" ios --modules qtmultimedia

          test -x "$QT_ROOT/$QT_VERSION/macos/bin/qt-cmake"
          test -x "$QT_ROOT/$QT_VERSION/ios/bin/qt-cmake"

      - name: Re-run source validation on macOS
        shell: bash
        run: |
          set -euxo pipefail
          for test in source_sanity.py sql_static_smoke.py i18n_static_smoke.py i18n_catalog_smoke.py; do
            if [[ -f "tests/$test" ]]; then
              python3 "tests/$test"
            fi
          done

      - name: Compile translation catalog
        shell: bash
        run: |
          set -euxo pipefail
          QT_HOST="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          if [[ -f i18n/qupil_de.ts ]]; then
            "$QT_HOST/bin/lrelease" i18n/qupil_de.ts -qm i18n/qupil_de.qm
            test -s i18n/qupil_de.qm
          fi

      - name: Verify iOS FFmpeg integration
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'qt_add_ios_ffmpeg_libraries(qupil)' CMakeLists.txt
          grep -Fq 'QT_NO_FFMPEG_XCODE_EMBED_FRAMEWORKS_CODE_SIGN_ON_COPY' CMakeLists.txt

      - name: Configure iPhone/iPad Release
        shell: bash
        run: |
          set -euxo pipefail
          QT_ROOT="$RUNNER_TEMP/Qt"
          QT_HOST="$QT_ROOT/$QT_VERSION/macos"
          QT_IOS="$QT_ROOT/$QT_VERSION/ios"
          rm -rf build-ios
          "$QT_IOS/bin/qt-cmake" \
            -S . -B build-ios -G Xcode \
            -DQT_HOST_PATH="$QT_HOST" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-ios --config Release --parallel 4 -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build-ios -type d -name '*.app' -path '*iphoneos*' -print | head -n 1)"
          test -n "$APP"
          test -d "$APP"
          echo "Device app: $APP"

          IPA_FILENAME="Qupil-${QUPIL_SOURCE_VERSION}-${QUPIL_SOURCE_COMMIT_SHORT}-iOS-arm64.ipa"
          echo "QUPIL_IOS_IPA_FILENAME=$IPA_FILENAME" >> "$GITHUB_ENV"

          rm -rf dist Payload
          mkdir -p dist Payload
          /usr/bin/ditto "$APP" Payload/Qupil.app
          /usr/bin/zip -qry "dist/$IPA_FILENAME" Payload
          rm -rf Payload

          test -s "dist/$IPA_FILENAME"
          /usr/bin/unzip -Z1 "dist/$IPA_FILENAME" | grep -q '^Payload/Qupil.app/'
          shasum -a 256 "dist/$IPA_FILENAME"
          ls -lh "dist/$IPA_FILENAME"

      - name: Audit iOS package size
        shell: bash
        run: |
          set -euo pipefail

          IPA="dist/$QUPIL_IOS_IPA_FILENAME"
          test -s "$IPA"
          echo "IPA: $(du -sh "$IPA" | awk '{print $1}')"
          echo "Top 20 IPA members by uncompressed size:"
          unzip -l "$IPA" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ { print $1 "\t" $4 }' | sort -nr | head -20
          echo "Bundled frameworks:"
          unzip -Z1 "$IPA" | grep '/Frameworks/' | sed -E 's#(Payload/[^/]+/Frameworks/[^/]+).*#\1#' | sort -u || true
          echo "FFmpeg-related IPA members:"
          unzip -Z1 "$IPA" | grep -Ei '(avcodec|avformat|avutil|swresample|swscale|ffmpeg)' || true

          UNCOMPRESSED_BYTES="$(unzip -l "$IPA" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ { total += $1 } END { print total + 0 }')"
          FFMPEG_COUNT="$(unzip -Z1 "$IPA" | grep -Eic '(avcodec|avformat|avutil|swresample|swscale|ffmpeg)' || true)"
          FFMPEG_BYTES="$(unzip -l "$IPA" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ && tolower($4) ~ /(avcodec|avformat|avutil|swresample|swscale|ffmpeg)/ { total += $1 } END { print total + 0 }')"
          {
            echo '### iOS package audit'
            echo
            echo "- IPA: $(du -sh "$IPA" | awk '{print $1}')"
            echo "- Uncompressed members: $((UNCOMPRESSED_BYTES / 1024 / 1024)) MiB"
            echo "- FFmpeg-related members: $FFMPEG_COUNT ($((FFMPEG_BYTES / 1024 / 1024)) MiB uncompressed)"
            echo '- Stock Qt 6.11 iOS Multimedia requires its FFmpeg libraries at link time.'
            echo '- iOS FFmpeg removal therefore needs a separate native-audio/custom-Qt change; v2 does not strip required frameworks.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS IPA
        id: upload_ios
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.QUPIL_IOS_IPA_FILENAME }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Add iOS artifact link to summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload_ios.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            echo '## Qupil iOS'
            echo
            echo "Artifact: $QUPIL_IOS_IPA_FILENAME"
            echo "Commit: $QUPIL_SOURCE_COMMIT"
            echo
            echo "[IPA artifact herunterladen]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # iOS / iPadOS TESTFLIGHT DISTRIBUTION
  #
  # Deliberately separate from the unsigned SideStore job. This job only runs
  # when target=ios-testflight is selected, so "all" can never upload a build
  # to App Store Connect by accident.
  # ---------------------------------------------------------------------------
  ios_testflight:
    name: iOS/iPadOS TestFlight upload
    if: ${{ inputs.target == 'ios-testflight' }}
    runs-on: macos-26
    timeout-minutes: 90

    env:
      QT_VERSION: "6.11.2"
      IOS_DEPLOYMENT_TARGET: "17.0"
      QUPIL_IOS_BUNDLE_ID: "org.qupil.app"
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout committed Qupil source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Verify TestFlight secrets
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            APPLE_TEAM_ID \
            IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 \
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            IOS_APP_STORE_PROFILE_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY_P8_BASE64; do
              if [[ -z "${!name:-}" ]]; then
                missing+=("$name")
              fi
          done

          if ((${#missing[@]})); then
            printf '::error::Missing TestFlight repository secrets: %s\n' "${missing[*]}"
            echo 'See docs/TESTFLIGHT_GITHUB.md for the one-time Apple/GitHub setup.'
            exit 1
          fi

          [[ "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || {
            echo '::error::APPLE_TEAM_ID must be the 10-character Apple Developer Team ID.'
            exit 1
          }

      - name: Resolve TestFlight metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_COMMIT_SHORT="$(git rev-parse --short=7 HEAD)"
          PROGRAM_VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$PROGRAM_VERSION" ]]

          # CFBundleVersion is numeric and unique for each workflow attempt.
          IOS_BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          [[ "$IOS_BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]

          {
            echo "QUPIL_SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "QUPIL_SOURCE_COMMIT_SHORT=$SOURCE_COMMIT_SHORT"
            echo "QUPIL_SOURCE_VERSION=$PROGRAM_VERSION"
            echo "QUPIL_IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER"
          } >> "$GITHUB_ENV"

          echo "Qupil marketing version: $PROGRAM_VERSION"
          echo "TestFlight build number: $IOS_BUILD_NUMBER"
          echo "Bundle ID: $QUPIL_IOS_BUNDLE_ID"
          echo "Source commit: $SOURCE_COMMIT"

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

          XCODE_MAJOR="$(xcodebuild -version | awk '/^Xcode / { split($2, p, "."); print p[1]; exit }')"
          [[ "$XCODE_MAJOR" =~ ^[0-9]+$ ]]
          if ((XCODE_MAJOR < 26)); then
            echo "::error::App Store Connect requires Qupil's 2026 iOS builds to use Xcode 26 or newer."
            exit 1
          fi

      - name: Install Qt host and iOS
        shell: bash
        run: |
          set -euo pipefail
          AQT_VENV="$RUNNER_TEMP/aqt-venv-testflight"
          QT_ROOT="$RUNNER_TEMP/Qt-testflight"
          python3 -m venv "$AQT_VENV"
          "$AQT_VENV/bin/python" -m pip install --upgrade pip
          "$AQT_VENV/bin/python" -m pip install 'aqtinstall==3.3.0'

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --arch "$QT_VERSION" | tee "$RUNNER_TEMP/qt-ios-testflight-arches.txt"
          grep -Eq '(^|[[:space:]])ios([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-testflight-arches.txt"

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --modules "$QT_VERSION" ios | tee "$RUNNER_TEMP/qt-ios-testflight-modules.txt"
          grep -Eq '(^|[[:space:]])qtmultimedia([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-testflight-modules.txt"

          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac desktop "$QT_VERSION" clang_64 --modules qtmultimedia
          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac ios "$QT_VERSION" ios --modules qtmultimedia

          test -x "$QT_ROOT/$QT_VERSION/macos/bin/qt-cmake"
          test -x "$QT_ROOT/$QT_VERSION/ios/bin/qt-cmake"

      - name: Re-run source validation on macOS
        shell: bash
        run: |
          set -euo pipefail
          for test in source_sanity.py sql_static_smoke.py i18n_static_smoke.py i18n_catalog_smoke.py testflight_static_smoke.py; do
            if [[ -f "tests/$test" ]]; then
              python3 "tests/$test"
            fi
          done

      - name: App Store asset preflight
        shell: bash
        run: |
          set -euo pipefail
          ICON="ios/Assets.xcassets/AppIcon.appiconset/AppIcon1024x1024.png"
          test -s "$ICON"
          WIDTH="$(sips -g pixelWidth "$ICON" | awk '/pixelWidth:/ {print $2}')"
          HEIGHT="$(sips -g pixelHeight "$ICON" | awk '/pixelHeight:/ {print $2}')"
          HAS_ALPHA="$(sips -g hasAlpha "$ICON" | awk '/hasAlpha:/ {print tolower($2)}')"
          [[ "$WIDTH" == "1024" && "$HEIGHT" == "1024" ]] || {
            echo "::error::App Store icon must be 1024x1024; got ${WIDTH}x${HEIGHT}."
            exit 1
          }
          [[ "$HAS_ALPHA" != "yes" ]] || {
            echo '::error::App Store icon must not contain an alpha channel.'
            exit 1
          }
          grep -Fq 'XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER "org.qupil.app"' CMakeLists.txt

      - name: Compile translation catalog
        shell: bash
        run: |
          set -euo pipefail
          QT_HOST="$RUNNER_TEMP/Qt-testflight/$QT_VERSION/macos"
          if [[ -f i18n/qupil_de.ts ]]; then
            "$QT_HOST/bin/lrelease" i18n/qupil_de.ts -qm i18n/qupil_de.qm
            test -s i18n/qupil_de.qm
          fi

      - name: Install distribution certificate and App Store profile
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/qupil-testflight.keychain-db"
          P12_PATH="$RUNNER_TEMP/qupil-distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/qupil-app-store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/qupil-app-store-profile.plist"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          export P12_PATH PROFILE_PATH
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ['P12_PATH']).write_bytes(
              base64.b64decode(os.environ['IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64'], validate=True)
          )
          Path(os.environ['PROFILE_PATH']).write_bytes(
              base64.b64decode(os.environ['IOS_APP_STORE_PROFILE_BASE64'], validate=True)
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security import "$P12_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null

          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$IDENTITIES"
          grep -Fq 'Apple Distribution' <<<"$IDENTITIES" || {
            echo '::error::The imported P12 does not contain an Apple Distribution identity with private key.'
            exit 1
          }

          openssl pkcs12 \
            -in "$P12_PATH" \
            -clcerts -nokeys \
            -passin env:IOS_DISTRIBUTION_CERTIFICATE_PASSWORD \
            -out "$RUNNER_TEMP/qupil-distribution-cert.pem"
          CERT_SUBJECT="$(openssl x509 -in "$RUNNER_TEMP/qupil-distribution-cert.pem" -noout -subject -nameopt RFC2253)"
          CERT_DATES="$(openssl x509 -in "$RUNNER_TEMP/qupil-distribution-cert.pem" -noout -dates)"
          echo "$CERT_SUBJECT"
          echo "$CERT_DATES"
          grep -Fq "OU=$APPLE_TEAM_ID" <<<"$CERT_SUBJECT" || {
            echo '::error::Apple Distribution certificate belongs to a different Team ID.'
            exit 1
          }
          openssl x509 -in "$RUNNER_TEMP/qupil-distribution-cert.pem" -checkend 0 -noout

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          export PROFILE_PLIST
          python3 - <<'PY'
          import datetime as dt
          import os
          import plistlib
          from pathlib import Path

          profile = plistlib.loads(Path(os.environ['PROFILE_PLIST']).read_bytes())
          expected_team = os.environ['APPLE_TEAM_ID']
          expected_bundle = os.environ['QUPIL_IOS_BUNDLE_ID']
          team_ids = profile.get('TeamIdentifier') or []
          team = team_ids[0] if team_ids else ''
          ent = profile.get('Entitlements') or {}
          app_id = ent.get('application-identifier', '')
          expected_app_id = f'{expected_team}.{expected_bundle}'
          expiry = profile.get('ExpirationDate')
          now = dt.datetime.now(dt.timezone.utc)
          if expiry is not None and expiry.tzinfo is None:
              expiry = expiry.replace(tzinfo=dt.timezone.utc)

          errors = []
          if team != expected_team:
              errors.append(f'profile TeamIdentifier={team!r}, expected {expected_team!r}')
          if app_id != expected_app_id:
              errors.append(f'profile application-identifier={app_id!r}, expected {expected_app_id!r}')
          if ent.get('get-task-allow', False):
              errors.append('profile has get-task-allow=true (development profile, not App Store distribution)')
          if profile.get('ProvisionsAllDevices'):
              errors.append('profile is an enterprise profile, not App Store distribution')
          if profile.get('ProvisionedDevices'):
              errors.append('profile contains device UDIDs (development/ad-hoc profile, not App Store distribution)')
          if expiry is None or expiry <= now:
              errors.append(f'profile is expired or has no usable expiration date: {expiry!r}')
          if errors:
              raise SystemExit('Invalid App Store provisioning profile:\n- ' + '\n- '.join(errors))

          github_env = Path(os.environ['GITHUB_ENV'])
          with github_env.open('a', encoding='utf-8') as f:
              f.write(f"IOS_PROFILE_UUID={profile['UUID']}\n")
              f.write(f"IOS_PROFILE_NAME={profile['Name']}\n")

          print('Provisioning profile:', profile['Name'])
          print('UUID:', profile['UUID'])
          print('Team:', team)
          print('Application identifier:', app_id)
          print('Expires:', expiry.isoformat())
          PY

          PROFILE_INSTALL_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_INSTALL_DIR"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_DIR/$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST").mobileprovision"

          echo "QUPIL_TESTFLIGHT_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "QUPIL_TESTFLIGHT_PROFILE_PLIST=$PROFILE_PLIST" >> "$GITHUB_ENV"

      - name: Configure signed iPhone/iPad Release
        shell: bash
        run: |
          set -euo pipefail
          QT_ROOT="$RUNNER_TEMP/Qt-testflight"
          QT_HOST="$QT_ROOT/$QT_VERSION/macos"
          QT_IOS="$QT_ROOT/$QT_VERSION/ios"
          rm -rf build-ios-testflight

          "$QT_IOS/bin/qt-cmake" \
            -S . -B build-ios-testflight -G Xcode \
            -DQT_HOST_PATH="$QT_HOST" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DQUPIL_IOS_BUILD_NUMBER="$QUPIL_IOS_BUILD_NUMBER" \
            -DQT_USE_RISKY_DSYM_ARCHIVING_WORKAROUND=ON \
            -DQUPIL_IOS_DISABLE_FFMPEG_CODE_SIGN_ON_COPY=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="Apple Distribution" \
            -DCMAKE_XCODE_ATTRIBUTE_PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=YES \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=YES

          XCODE_PROJECT="$(find build-ios-testflight -maxdepth 2 -type d -name '*.xcodeproj' -print -quit)"
          [[ -n "$XCODE_PROJECT" ]]
          echo "QUPIL_XCODE_PROJECT=$XCODE_PROJECT" >> "$GITHUB_ENV"
          xcodebuild -list -project "$XCODE_PROJECT"

      - name: Prebuild signed Release before archive
        shell: bash
        run: |
          set -euo pipefail
          # Qt documents a CMake/Xcode archive issue that is avoided by first
          # building the Release configuration before running xcodebuild archive.
          cmake --build build-ios-testflight --config Release --parallel 4 -- \
            -sdk iphoneos \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES

      - name: Resolve Xcode scheme and archive
        shell: bash
        run: |
          set -euo pipefail
          LIST_JSON="$RUNNER_TEMP/qupil-xcode-list.json"
          xcodebuild -list -json -project "$QUPIL_XCODE_PROJECT" > "$LIST_JSON"
          export LIST_JSON
          SCHEME="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ['LIST_JSON']).read_text())
          container = data.get('project') or data.get('workspace') or {}
          schemes = container.get('schemes') or []
          if 'qupil' in schemes:
              print('qupil')
          elif 'Qupil' in schemes:
              print('Qupil')
          elif len(schemes) == 1:
              print(schemes[0])
          else:
              raise SystemExit(f'Cannot choose Qupil Xcode scheme from {schemes!r}')
          PY
          )"
          [[ -n "$SCHEME" ]]

          ARCHIVE_PATH="$RUNNER_TEMP/Qupil-${QUPIL_SOURCE_VERSION}-${QUPIL_IOS_BUILD_NUMBER}.xcarchive"
          rm -rf "$ARCHIVE_PATH"
          xcodebuild \
            -project "$QUPIL_XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            ENABLE_ONLY_ACTIVE_RESOURCES=NO

          APP="$ARCHIVE_PATH/Products/Applications/Qupil.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          [[ "$ACTUAL_BUNDLE_ID" == "$QUPIL_IOS_BUNDLE_ID" ]]
          [[ "$ACTUAL_VERSION" == "$QUPIL_SOURCE_VERSION" ]]
          [[ "$ACTUAL_BUILD" == "$QUPIL_IOS_BUILD_NUMBER" ]]
          test -s "$APP/embedded.mobileprovision"
          DSYM_COUNT="$(find "$ARCHIVE_PATH/dSYMs" -maxdepth 1 -type d -name '*.dSYM' -print 2>/dev/null | wc -l | tr -d ' ')"
          if [[ "$DSYM_COUNT" == "0" ]]; then
            echo '::error::No dSYM bundle was archived; TestFlight crash symbolication would be incomplete.'
            exit 1
          fi

          PRIVACY_COUNT="$(find "$APP" -name 'PrivacyInfo.xcprivacy' -print | wc -l | tr -d ' ')"
          echo "Privacy manifests in app bundle: $PRIVACY_COUNT"
          if [[ "$PRIVACY_COUNT" == "0" ]]; then
            echo '::warning::No PrivacyInfo.xcprivacy was found in the final app bundle. This is not guessed automatically; review Apple privacy-manifest requirements before App Store submission.'
          fi

          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/qupil-embedded-profile.plist"
          EMBEDDED_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/qupil-embedded-profile.plist")"
          [[ "$EMBEDDED_APP_ID" == "$APPLE_TEAM_ID.$QUPIL_IOS_BUNDLE_ID" ]]

          echo "QUPIL_ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"
          echo "QUPIL_XCODE_SCHEME=$SCHEME" >> "$GITHUB_ENV"

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/qupil-testflight-export"
          EXPORT_OPTIONS="$RUNNER_TEMP/qupil-export-options.plist"
          rm -rf "$EXPORT_DIR"
          mkdir -p "$EXPORT_DIR" dist
          export EXPORT_OPTIONS

          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'method': 'app-store-connect',
              'destination': 'export',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'signingCertificate': 'Apple Distribution',
              'provisioningProfiles': {
                  os.environ['QUPIL_IOS_BUNDLE_ID']: os.environ['IOS_PROFILE_NAME'],
              },
              'manageAppVersionAndBuildNumber': False,
              'uploadSymbols': True,
          }
          with Path(os.environ['EXPORT_OPTIONS']).open('wb') as f:
              plistlib.dump(options, f)
          PY

          plutil -p "$EXPORT_OPTIONS"
          xcodebuild -exportArchive \
            -archivePath "$QUPIL_ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          SOURCE_IPA="$(find "$EXPORT_DIR" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -s "$SOURCE_IPA"
          IPA_FILENAME="Qupil-${QUPIL_SOURCE_VERSION}-${QUPIL_SOURCE_COMMIT_SHORT}-TestFlight-build-${QUPIL_IOS_BUILD_NUMBER}.ipa"
          IPA="dist/$IPA_FILENAME"
          cp "$SOURCE_IPA" "$IPA"
          test -s "$IPA"

          VERIFY_DIR="$RUNNER_TEMP/qupil-testflight-verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          ditto -x -k "$IPA" "$VERIFY_DIR"
          EXPORTED_APP="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$EXPORTED_APP"
          codesign --verify --deep --strict --verbose=2 "$EXPORTED_APP"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXPORTED_APP/Info.plist")" == "$QUPIL_IOS_BUNDLE_ID" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$EXPORTED_APP/Info.plist")" == "$QUPIL_SOURCE_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$EXPORTED_APP/Info.plist")" == "$QUPIL_IOS_BUILD_NUMBER" ]]

          DSYM_FILENAME="Qupil-${QUPIL_SOURCE_VERSION}-${QUPIL_SOURCE_COMMIT_SHORT}-TestFlight-build-${QUPIL_IOS_BUILD_NUMBER}-dSYMs.zip"
          DSYM_ZIP="dist/$DSYM_FILENAME"
          test -d "$QUPIL_ARCHIVE_PATH/dSYMs"
          ditto -c -k --sequesterRsrc --keepParent "$QUPIL_ARCHIVE_PATH/dSYMs" "$DSYM_ZIP"
          test -s "$DSYM_ZIP"

          shasum -a 256 "$IPA"
          ls -lh "$IPA"
          {
            echo "QUPIL_TESTFLIGHT_IPA_FILENAME=$IPA_FILENAME"
            echo "QUPIL_TESTFLIGHT_IPA=$IPA"
            echo "QUPIL_TESTFLIGHT_DSYM_FILENAME=$DSYM_FILENAME"
            echo "QUPIL_TESTFLIGHT_DSYM_ZIP=$DSYM_ZIP"
          } >> "$GITHUB_ENV"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: Qupil-TestFlight-IPA
          path: ${{ env.QUPIL_TESTFLIGHT_IPA }}
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload dSYMs artifact
        uses: actions/upload-artifact@v7
        with:
          name: Qupil-TestFlight-dSYMs
          path: ${{ env.QUPIL_TESTFLIGHT_DSYM_ZIP }}
          archive: false
          if-no-files-found: warn
          retention-days: 30

      - name: Validate and upload to App Store Connect
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          export KEY_PATH

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ['KEY_PATH']).write_bytes(
              base64.b64decode(os.environ['APP_STORE_CONNECT_API_KEY_P8_BASE64'], validate=True)
          )
          PY
          chmod 600 "$KEY_PATH"

          echo 'Validating signed IPA with App Store Connect...'
          xcrun altool \
            --validate-app \
            -f "$QUPIL_TESTFLIGHT_IPA" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/qupil-altool-validate.log"

          echo 'Uploading signed IPA to App Store Connect/TestFlight...'
          xcrun altool \
            --upload-app \
            -f "$QUPIL_TESTFLIGHT_IPA" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/qupil-altool-upload.log"

      - name: TestFlight summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Qupil TestFlight upload'
            echo
            echo "- Bundle ID: \`$QUPIL_IOS_BUNDLE_ID\`"
            echo "- Version: \`$QUPIL_SOURCE_VERSION\`"
            echo "- Build: \`$QUPIL_IOS_BUILD_NUMBER\`"
            echo "- Commit: \`$QUPIL_SOURCE_COMMIT\`"
            echo "- IPA: \`$QUPIL_TESTFLIGHT_IPA_FILENAME\`"
            echo '- App Store Connect accepted the upload; Apple still has to process the build before it appears in TestFlight.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean signing material
        if: ${{ always() }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          set +e
          if [[ -n "${IOS_PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "${APP_STORE_CONNECT_KEY_ID:-}" ]]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          fi
          if [[ -n "${QUPIL_TESTFLIGHT_KEYCHAIN:-}" ]]; then
            security delete-keychain "$QUPIL_TESTFLIGHT_KEYCHAIN" >/dev/null 2>&1 || true
          fi
          rm -f \
            "$RUNNER_TEMP/qupil-distribution.p12" \
            "$RUNNER_TEMP/qupil-app-store.mobileprovision" \
            "$RUNNER_TEMP/qupil-distribution-cert.pem" \
            "$RUNNER_TEMP/qupil-app-store-profile.plist" \
            "$RUNNER_TEMP/qupil-embedded-profile.plist"
