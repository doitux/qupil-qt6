# QUPIL_CI_MANAGED
#
# Qupil Cross-Platform CI
# Linux wird absichtlich lokal mit Qt Creator gebaut.
#
# Die Jobs sind nur manuell startbar.

name: Qupil on-demand builds

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Was soll gebaut werden?"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - android
          - ios

      source_ref:
        description: "Branch, Tag oder Commit mit dem zu bauenden Qupil-Stand"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CI_QT_VERSION: "6.10.3"
  IOS_QT_VERSION: "6.11.2"
  IOS_DEPLOYMENT_TARGET: "17.0"
  BUILD_TYPE: "Release"

jobs:

  # ---------------------------------------------------------------------------
  # WINDOWS
  #
  # Wichtig:
  # Qt-Paket ist MSVC 2022. Deshalb benutzen wir auch wirklich cl.exe/MSVC.
  # Der Runner windows-2022 enthaelt VS 2022; msvc-dev-cmd setzt die Umgebung.
  # Ninja vermeidet Generator-/Visual-Studio-Discovery-Probleme.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: "qtmultimedia"
          cache: true

      - name: Enable MSVC 2022 x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Toolchain preflight
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Qt root: $env:QT_ROOT_DIR"
          Write-Host "PATH: $env:PATH"

          where.exe cl
          where.exe cmake
          where.exe ninja
          where.exe windeployqt

          cl 2>&1 | Select-Object -First 5
          cmake --version
          ninja --version
          qmake --version

          $required = @(
            "$env:QT_ROOT_DIR\lib\cmake\Qt6\Qt6Config.cmake",
            "$env:QT_ROOT_DIR\lib\cmake\Qt6Multimedia\Qt6MultimediaConfig.cmake",
            "$env:QT_ROOT_DIR\lib\cmake\Qt6Svg\Qt6SvgConfig.cmake"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Erforderliche Qt-Datei fehlt: $file"
            }
          }

      - name: Configure
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          cmake -S . -B build/windows -G Ninja `
            -DCMAKE_BUILD_TYPE="${{ env.BUILD_TYPE }}" `
            -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build/windows --parallel

      - name: Package portable Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-ChildItem build/windows -Recurse -File -Filter "qupil.exe" |
            Where-Object { $_.FullName -notmatch "[\\/]CMakeFiles[\\/]" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Host "Build files:"
            Get-ChildItem build/windows -Recurse -File |
              Select-Object -First 200 FullName
            throw "qupil.exe wurde nicht gefunden."
          }

          $distRoot = Join-Path $env:GITHUB_WORKSPACE "dist"
          $dist = Join-Path $distRoot "Qupil-Windows-x64"

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          $destExe = Join-Path $dist "qupil.exe"
          Copy-Item $exe.FullName $destExe -Force

          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" `
            --release `
            --compiler-runtime `
            --dir "$dist" `
            "$destExe"

          if (Test-Path "data") {
            Copy-Item "data" (Join-Path $dist "data") -Recurse -Force
          }

          $zip = Join-Path $distRoot "Qupil-Windows-x64.zip"
          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive -Path "$dist\*" -DestinationPath $zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qupil-Windows-x64
          path: dist/Qupil-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14


  # ---------------------------------------------------------------------------
  # macOS ARM64
  # macos-15 ist bei Standard-GitHub-Runnern ARM64.
  # Wir setzen explizit Apple clang, damit kein Homebrew-clang dazwischenkommt.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS ARM64
    if: ${{ inputs.target == 'all' || inputs.target == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: mac
          target: desktop
          modules: "qtmultimedia"
          cache: true

      - name: Toolchain preflight
        shell: bash
        run: |
          set -euxo pipefail

          uname -a
          uname -m

          /usr/bin/clang++ --version
          cmake --version
          ninja --version
          "$QT_ROOT_DIR/bin/qmake" --version

          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"

      - name: Configure
        shell: bash
        env:
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
        run: |
          set -euxo pipefail

          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/macos \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build/macos --parallel

      - name: Package macOS build
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist/Qupil-macOS-arm64

          APP="$(find build/macos -type d -name '*.app' -print -quit || true)"

          if [[ -n "$APP" ]]; then
              echo "Found app: $APP"

              "$QT_ROOT_DIR/bin/macdeployqt" "$APP"

              cp -R "$APP" dist/Qupil-macOS-arm64/

              if [[ -d data ]]; then
                  cp -R data dist/Qupil-macOS-arm64/
              fi

              (
                  cd dist
                  ditto -c -k --sequesterRsrc --keepParent \
                    Qupil-macOS-arm64 \
                    Qupil-macOS-arm64.zip
              )
          else
              BIN="$(find build/macos -type f -name qupil -perm -111 -print -quit || true)"

              if [[ -z "$BIN" ]]; then
                  find build/macos -maxdepth 4 -type f -print | head -200
                  echo "Weder .app-Bundle noch qupil-Binary gefunden." >&2
                  exit 1
              fi

              cp "$BIN" dist/Qupil-macOS-arm64/

              if [[ -d data ]]; then
                  cp -R data dist/Qupil-macOS-arm64/
              fi

              tar -C dist -czf dist/Qupil-macOS-arm64.tar.gz Qupil-macOS-arm64
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qupil-macOS-arm64
          path: |
            dist/Qupil-macOS-arm64.zip
            dist/Qupil-macOS-arm64.tar.gz
          if-no-files-found: error
          retention-days: 14


  # ---------------------------------------------------------------------------
  # ANDROID ARM64
  # Qt 6.10:
  #   JDK 17
  #   Android API 36
  #   Build Tools 36.0.0
  #   NDK 27.2.12479018
  # ---------------------------------------------------------------------------
  android:
    name: Android ARM64 APK
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - name: Checkout Qupil
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK and NDK for Qt 6.10
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"

      - name: Install Qt for Android ARM64
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.CI_QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: "qtmultimedia"
          cache: true

      - name: Android preflight
        shell: bash
        run: |
          set -euxo pipefail

          java -version
          cmake --version
          ninja --version

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "QT_ROOT_DIR=$QT_ROOT_DIR"
          echo "QT_HOST_PATH=${QT_HOST_PATH:-}"

          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6/qt.toolchain.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake"
          test -f "$QT_ROOT_DIR/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"

      - name: Configure Android
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euxo pipefail

          EXTRA_ARGS=()

          if [[ -n "${QT_HOST_PATH:-}" ]]; then
              EXTRA_ARGS+=("-DQT_HOST_PATH=$QT_HOST_PATH")
          fi

          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . \
            -B build/android \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            "${EXTRA_ARGS[@]}"

      - name: Build Android APK
        shell: bash
        run: |
          set -euxo pipefail

          cmake --build build/android --target apk --parallel

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          mapfile -t APKS < <(
              find build/android -type f -name '*.apk' -print
          )

          if ((${#APKS[@]} == 0)); then
              echo "Kein APK gefunden." >&2
              find build/android -maxdepth 6 -type f -print | head -300
              exit 1
          fi

          for apk in "${APKS[@]}"; do
              cp "$apk" "dist/$(basename "$apk")"
          done

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qupil-Android-arm64
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14


  # ---------------------------------------------------------------------------
  # iOS SIMULATOR ARM64
  #
  # Absichtlich ohne Signing. Das Ergebnis dient fuer CI/Simulator-Tests.
  # Eine echte iPhone/TestFlight-Version braucht spaeter Signing-Secrets.
  # ---------------------------------------------------------------------------
  # iOS / iPadOS DEVICE BUILD
  #
  # Diese Logik stammt aus dem bisherigen build-qupil-ios-from-dev.sh.
  # Es wird direkt der durch source_ref ausgewaehlte Commit gebaut.
  # Kein Mirror-Repo, kein zweiter Dispatch, kein lokales Snapshot-Repo.
  # Ergebnis: unsigned IPA fuer den bestehenden SideStore-Workflow.
  # ---------------------------------------------------------------------------
  # iOS / iPadOS DEVICE BUILD
  #
  # Diese Logik stammt aus dem bisherigen build-qupil-ios-from-dev.sh.
  # Es wird direkt der durch source_ref ausgewaehlte Commit gebaut.
  # Kein Mirror-Repo, kein zweiter Dispatch, kein lokales Snapshot-Repo.
  # Ergebnis: unsigned IPA fuer den bestehenden SideStore-Workflow.
  # ---------------------------------------------------------------------------
  ios:
    name: iOS/iPadOS unsigned IPA
    if: ${{ inputs.target == 'all' || inputs.target == 'ios' }}
    runs-on: macos-26
    timeout-minutes: 75

    permissions:
      contents: write

    env:
      QT_VERSION: "6.11.2"
      IOS_DEPLOYMENT_TARGET: "17.0"

    steps:
      - name: Checkout committed Qupil source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}

      - name: Resolve source metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          SOURCE_COMMIT_SHORT="$(git rev-parse --short=12 HEAD)"
          PROGRAM_VERSION="$(sed -nE 's/^[[:space:]]*project\(Qupil[[:space:]]+VERSION[[:space:]]+([0-9.]+).*/\1/p' CMakeLists.txt | head -n1)"
          [[ -n "$PROGRAM_VERSION" ]] || PROGRAM_VERSION="unknown"
          {
            echo "QUPIL_SOURCE_COMMIT=$SOURCE_COMMIT"
            echo "QUPIL_SOURCE_COMMIT_SHORT=$SOURCE_COMMIT_SHORT"
            echo "QUPIL_SOURCE_VERSION=$PROGRAM_VERSION"
          } >> "$GITHUB_ENV"
          echo "Qupil version: $PROGRAM_VERSION"
          echo "Source commit: $SOURCE_COMMIT"

      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          uname -m
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          ninja --version || true
          gh --version

      - name: Install Qt host and iOS
        shell: bash
        run: |
          set -euxo pipefail
          AQT_VENV="$RUNNER_TEMP/aqt-venv"
          QT_ROOT="$RUNNER_TEMP/Qt"
          python3 -m venv "$AQT_VENV"
          "$AQT_VENV/bin/python" -m pip install --upgrade pip
          "$AQT_VENV/bin/python" -m pip install 'aqtinstall==3.3.0'

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --arch "$QT_VERSION" | tee "$RUNNER_TEMP/qt-ios-arches.txt"
          grep -Eq '(^|[[:space:]])ios([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-arches.txt"

          "$AQT_VENV/bin/python" -m aqt list-qt mac ios --modules "$QT_VERSION" ios | tee "$RUNNER_TEMP/qt-ios-modules.txt"
          grep -Eq '(^|[[:space:]])qtmultimedia([[:space:]]|$)' "$RUNNER_TEMP/qt-ios-modules.txt"

          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac desktop "$QT_VERSION" clang_64 --modules qtmultimedia
          "$AQT_VENV/bin/python" -m aqt install-qt --outputdir "$QT_ROOT" --internal mac ios "$QT_VERSION" ios --modules qtmultimedia

          test -x "$QT_ROOT/$QT_VERSION/macos/bin/qt-cmake"
          test -x "$QT_ROOT/$QT_VERSION/ios/bin/qt-cmake"

      - name: Re-run source validation on macOS
        shell: bash
        run: |
          set -euxo pipefail
          for test in source_sanity.py sql_static_smoke.py i18n_static_smoke.py i18n_catalog_smoke.py; do
            if [[ -f "tests/$test" ]]; then
              python3 "tests/$test"
            fi
          done

      - name: Compile translation catalog
        shell: bash
        run: |
          set -euxo pipefail
          QT_HOST="$RUNNER_TEMP/Qt/$QT_VERSION/macos"
          if [[ -f i18n/qupil_de.ts ]]; then
            "$QT_HOST/bin/lrelease" i18n/qupil_de.ts -qm i18n/qupil_de.qm
            test -s i18n/qupil_de.qm
          fi

      - name: Verify iOS FFmpeg integration
        shell: bash
        run: |
          set -euxo pipefail
          grep -Fq 'qt_add_ios_ffmpeg_libraries(qupil)' CMakeLists.txt
          grep -Fq 'QT_NO_FFMPEG_XCODE_EMBED_FRAMEWORKS_CODE_SIGN_ON_COPY' CMakeLists.txt

      - name: Configure iPhone/iPad Release
        shell: bash
        run: |
          set -euxo pipefail
          QT_ROOT="$RUNNER_TEMP/Qt"
          QT_HOST="$QT_ROOT/$QT_VERSION/macos"
          QT_IOS="$QT_ROOT/$QT_VERSION/ios"
          rm -rf build-ios
          "$QT_IOS/bin/qt-cmake" \
            -S . -B build-ios -G Xcode \
            -DQT_HOST_PATH="$QT_HOST" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$IOS_DEPLOYMENT_TARGET" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=""

      - name: Build unsigned device app
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-ios --config Release --parallel 4 -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euxo pipefail
          APP="$(find build-ios -type d -name '*.app' -path '*iphoneos*' -print | head -n 1)"
          test -n "$APP"
          test -d "$APP"
          echo "Device app: $APP"

          rm -rf dist Payload
          mkdir -p dist Payload
          /usr/bin/ditto "$APP" Payload/Qupil.app
          /usr/bin/zip -qry dist/Qupil-ios-unsigned.ipa Payload
          rm -rf Payload

          test -s dist/Qupil-ios-unsigned.ipa
          /usr/bin/unzip -Z1 dist/Qupil-ios-unsigned.ipa | grep -q '^Payload/Qupil.app/'
          shasum -a 256 dist/Qupil-ios-unsigned.ipa > dist/SHA256SUMS

          {
            echo "Qupil: $QUPIL_SOURCE_VERSION"
            echo "Source commit: $QUPIL_SOURCE_COMMIT"
            echo "Qt: $QT_VERSION"
            echo "Runner: macos-26"
            xcodebuild -version
            echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
            echo "Deployment target: $IOS_DEPLOYMENT_TARGET"
          } > dist/BUILD-INFO.txt

          ls -lh dist/Qupil-ios-unsigned.ipa
          cat dist/SHA256SUMS

      - name: Publish IPA as direct download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ios-unsigned-latest
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/dist/Qupil-ios-unsigned.ipa"
          test -s "$IPA"

          NOTES_FILE="$RUNNER_TEMP/qupil-ios-release-notes.txt"
          {
            echo 'Automatisch erzeugter unsigned iOS/iPadOS Build von Qupil.'
            echo
            echo "Qupil: $QUPIL_SOURCE_VERSION"
            echo "Commit: $QUPIL_SOURCE_COMMIT"
            echo "Workflow Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo 'Die IPA ist fuer die Installation ueber SideStore vorgesehen.'
          } > "$NOTES_FILE"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          fi

          gh release create "$RELEASE_TAG" "$IPA#Qupil-ios-unsigned.ipa" \
            --target "$QUPIL_SOURCE_COMMIT" \
            --title 'Qupil iOS unsigned - latest' \
            --notes-file "$NOTES_FILE" \
            --prerelease

          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/Qupil-ios-unsigned.ipa"
          {
            echo '## Qupil iOS'
            echo
            echo "[Qupil-ios-unsigned.ipa direkt herunterladen]($DIRECT_URL)"
            echo
            echo "Commit: $QUPIL_SOURCE_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Direkter Download: $DIRECT_URL"
