name: Mobile packages

on:
  workflow_dispatch:
  push:
    branches:
      - migration/qml-mobile

permissions:
  contents: read

env:
  QT_VERSION: '6.11.2'

jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018'
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: android
          arch: android_arm64_v8a
          modules: qtmultimedia
          cache: true

      - name: Build APK
        shell: bash
        run: |
          export QT_ANDROID_ROOT="$QT_ROOT_DIR"
          ./scripts/build-android-release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Qupil-Android-arm64
          path: dist/Qupil-android-arm64.apk
          if-no-files-found: error

  ios-unsigned:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt for iOS
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          target: ios
          modules: qtmultimedia
          cache: true

      - name: Build unsigned iOS IPA
        shell: bash
        run: |
          export QT_IOS_ROOT="$QT_ROOT_DIR"
          ./scripts/build-ios-unsigned.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Qupil-iOS-unsigned
          path: dist/Qupil-ios-unsigned.ipa
          if-no-files-found: error
